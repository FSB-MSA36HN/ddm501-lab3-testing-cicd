name: CD
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Validate release before publication
        run: |
          pip install -r requirements-build.txt
          pip install --no-build-isolation -r requirements.txt -r requirements-dev.txt
          black --check app tests scripts
          isort --check-only app tests scripts
          flake8 app tests scripts
          mypy app
          python scripts/train_model.py
          pytest --cov=app --cov-fail-under=80
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/thanhhai12/ddm501-lab3-testing-cicd:${{ github.ref_name }}
            ghcr.io/thanhhai12/ddm501-lab3-testing-cicd:latest
  staging:
    needs: release
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy and verify release in ephemeral staging
        run: |
          docker run -d -p 8000:8000 --name staging ghcr.io/thanhhai12/ddm501-lab3-testing-cicd:${{ github.ref_name }}
          for i in $(seq 1 60); do
            if curl -sf localhost:8000/health | python -c "import json,sys; assert json.load(sys.stdin)['model_loaded']"; then break; fi
            sleep 2
          done
          curl -sf -H 'Content-Type: application/json' -d '{"user_id":"196","movie_id":"242"}' localhost:8000/predict | python -c "import json,sys; assert 1 <= json.load(sys.stdin)['predicted_rating'] <= 5"
      - name: Clean up staging
        if: always()
        run: docker rm -f staging
