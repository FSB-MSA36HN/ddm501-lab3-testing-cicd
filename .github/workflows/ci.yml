name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-build.txt
          pip install --no-build-isolation -r requirements.txt -r requirements-dev.txt
      - name: Lint, format and types
        run: |
          flake8 app tests scripts
          black --check app tests scripts
          isort --check-only app tests scripts
          mypy app
      - name: Train and validate model
        run: python scripts/train_model.py
      - name: All four test categories and coverage gate
        run: pytest --cov=app --cov-fail-under=80 --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage
          path: |
            coverage.xml
            htmlcov/
            junit.xml
            models/metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/svd_model.pkl
  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models
      - name: Build and smoke-test serving image
        run: |
          docker build -t movie-rating-api:test .
          docker run -d -p 8000:8000 --name movie-api movie-rating-api:test
          for i in $(seq 1 60); do
            if curl -sf localhost:8000/health | python -c "import json,sys; assert json.load(sys.stdin)['model_loaded']"; then break; fi
            sleep 2
          done
          curl -sf localhost:8000/health | python -c "import json,sys; assert json.load(sys.stdin)['model_loaded']"
          curl -sf -H 'Content-Type: application/json' -d '{"user_id":"196","movie_id":"242"}' localhost:8000/predict | python -c "import json,sys; assert 1 <= json.load(sys.stdin)['predicted_rating'] <= 5"
      - name: Container logs
        if: failure()
        run: docker logs movie-api
      - name: Clean up
        if: always()
        run: docker rm -f movie-api
